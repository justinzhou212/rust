name: Rustc Perf Benchmark

on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: 'Git ref for baseline compiler (commit SHA, branch, or tag)'
        required: true
        default: '60d4c03b1c63ee2d4046af32b9182b9600d28858'
      include:
        description: 'Benchmark crates to include (regex pattern, e.g. serde|syn|cargo)'
        required: false
        default: 'serde|syn|regex-automata|ripgrep|cargo'
      profiles:
        description: 'Profiles to benchmark'
        required: false
        default: 'Opt'
      scenarios:
        description: 'Scenarios to benchmark'
        required: false
        default: 'Full,IncrUnchanged,IncrPatched'
      build_runner:
        description: 'Runner label for build jobs (e.g. ubuntu-latest, self-hosted)'
        required: false
        default: 'ubuntu-latest'
      bench_runner:
        description: 'Runner label for benchmark job (use self-hosted for stable results)'
        required: false
        default: 'ubuntu-latest'
  pull_request:
    paths:
      - 'compiler/**'

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1

jobs:
  # ── Build baseline compiler (parallel with build-modified) ───
  build-baseline:
    name: Build Baseline Compiler
    runs-on: ${{ github.event.inputs.build_runner || 'ubuntu-latest' }}
    timeout-minutes: 180
    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3 curl git

      - name: Checkout baseline
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.baseline_ref || '60d4c03b1c63ee2d4046af32b9182b9600d28858' }}

      - name: Configure baseline
        run: |
          cat > bootstrap.toml <<'EOF'
          [build]
          build-stage = 1
          [rust]
          optimize = true
          debug = false
          incremental = false
          EOF

      - name: Build stage 1 compiler
        run: python3 x.py build --stage 1

      - name: Package compiler
        run: |
          tar czf /tmp/baseline-compiler.tar.gz \
            build/x86_64-unknown-linux-gnu/stage1/

      - name: Upload compiler artifact
        uses: actions/upload-artifact@v4
        with:
          name: baseline-compiler
          path: /tmp/baseline-compiler.tar.gz
          retention-days: 1
          compression-level: 0

  # ── Build modified compiler (parallel with build-baseline) ───
  build-modified:
    name: Build Modified Compiler
    runs-on: ${{ github.event.inputs.build_runner || 'ubuntu-latest' }}
    timeout-minutes: 180
    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build python3 curl git

      - name: Checkout modified
        uses: actions/checkout@v4

      - name: Configure modified
        run: |
          cat > bootstrap.toml <<'EOF'
          [build]
          build-stage = 1
          [rust]
          optimize = true
          debug = false
          incremental = false
          EOF

      - name: Build stage 1 compiler
        run: python3 x.py build --stage 1

      - name: Package compiler
        run: |
          tar czf /tmp/modified-compiler.tar.gz \
            build/x86_64-unknown-linux-gnu/stage1/

      - name: Upload compiler artifact
        uses: actions/upload-artifact@v4
        with:
          name: modified-compiler
          path: /tmp/modified-compiler.tar.gz
          retention-days: 1
          compression-level: 0

  # ── Run benchmarks on dedicated runner ───────────────────────
  benchmark:
    name: Run Cachegrind Benchmarks
    needs: [build-baseline, build-modified]
    # Use a self-hosted runner for stable, reproducible results.
    # Self-hosted bare-metal eliminates noisy-neighbor effects.
    # Falls back to ubuntu-latest if no self-hosted runner is configured.
    runs-on: ${{ github.event.inputs.bench_runner || 'ubuntu-latest' }}
    timeout-minutes: 240
    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind build-essential python3 curl git

      - name: Install Rust nightly (for building rustc-perf)
        uses: dtolnay/rust-toolchain@nightly

      - name: Clone and build rustc-perf
        run: |
          git clone --depth 1 https://github.com/rust-lang/rustc-perf.git /tmp/rustc-perf
          cd /tmp/rustc-perf
          cargo build --release -p collector

      - name: Download baseline compiler
        uses: actions/download-artifact@v4
        with:
          name: baseline-compiler
          path: /tmp/artifacts/

      - name: Download modified compiler
        uses: actions/download-artifact@v4
        with:
          name: modified-compiler
          path: /tmp/artifacts/

      - name: Extract compilers
        run: |
          mkdir -p /tmp/baseline /tmp/modified
          cd /tmp/baseline && tar xzf /tmp/artifacts/baseline-compiler.tar.gz
          cd /tmp/modified && tar xzf /tmp/artifacts/modified-compiler.tar.gz
          chmod +x /tmp/baseline/build/x86_64-unknown-linux-gnu/stage1/bin/rustc
          chmod +x /tmp/modified/build/x86_64-unknown-linux-gnu/stage1/bin/rustc

      - name: Run baseline benchmarks
        run: |
          INCLUDE="${{ github.event.inputs.include || 'serde|syn|regex-automata|ripgrep|cargo' }}"
          PROFILES="${{ github.event.inputs.profiles || 'Opt' }}"
          SCENARIOS="${{ github.event.inputs.scenarios || 'Full,IncrUnchanged,IncrPatched' }}"

          /tmp/rustc-perf/target/release/collector bench_local \
            /tmp/baseline/build/x86_64-unknown-linux-gnu/stage1/bin/rustc \
            --id baseline \
            --db /tmp/results.db \
            --cargo "$(rustup which cargo)" \
            --profiles "$PROFILES" \
            --scenarios "$SCENARIOS" \
            --include "$INCLUDE" \
            --backends Cachegrind

      - name: Run modified benchmarks
        run: |
          INCLUDE="${{ github.event.inputs.include || 'serde|syn|regex-automata|ripgrep|cargo' }}"
          PROFILES="${{ github.event.inputs.profiles || 'Opt' }}"
          SCENARIOS="${{ github.event.inputs.scenarios || 'Full,IncrUnchanged,IncrPatched' }}"

          /tmp/rustc-perf/target/release/collector bench_local \
            /tmp/modified/build/x86_64-unknown-linux-gnu/stage1/bin/rustc \
            --id modified \
            --db /tmp/results.db \
            --cargo "$(rustup which cargo)" \
            --profiles "$PROFILES" \
            --scenarios "$SCENARIOS" \
            --include "$INCLUDE" \
            --backends Cachegrind

      # ── Compare and report ─────────────────────────────────────
      - name: Generate comparison
        run: |
          /tmp/rustc-perf/target/release/collector diff \
            /tmp/results.db baseline modified \
            2>&1 | tee /tmp/perf-comparison.txt || true

          echo "## Rustc Perf Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Runner:** \`$(hostname)\` — ${{ runner.os }} ${{ runner.arch }}" >> $GITHUB_STEP_SUMMARY
          echo "**Baseline:** \`${{ github.event.inputs.baseline_ref || '60d4c03b' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Modified:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat /tmp/perf-comparison.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: |
            /tmp/results.db
            /tmp/perf-comparison.txt
          retention-days: 30

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let comparison = 'Failed to read comparison results.';
            try { comparison = fs.readFileSync('/tmp/perf-comparison.txt', 'utf8'); } catch {}
            const body = [
              '## Rustc Perf Benchmark Results',
              '',
              `**Runner:** \`${process.env.RUNNER_NAME}\``,
              `**Baseline:** \`${{ github.event.inputs.baseline_ref || '60d4c03b' }}\``,
              `**Modified:** \`${{ github.sha }}\``,
              '',
              '```',
              comparison,
              '```',
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
